name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check the packaged sources
        run: node --check folding.js && node --check extension.js
      - name: Unit tests
        run: node test.js
